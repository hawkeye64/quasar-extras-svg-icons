packages:
  - 'icons'
  - 'docs'
overrides:
  # These packages supply SVG files only; their upstream build tools are unused here.
  'ikonate>jsdom': '-'
  'ikonate>xmldom': '-'
  'ikonate>pretty': '-'
  '@iconscout/unicons>svgo': '-'
  '@iconscout/unicons>ttf2woff2': '-'
  '@iconscout/unicons>uuid': '-'
  '@iconscout/unicons>fontello-cli': '-'
  '@iconscout/unicons>fs-plus': '-'
  '@iconscout/unicons>glob': '-'
  'simple-line-icons>less': '-'
  'brace-expansion@>=1 <2': 1.1.21
  'brace-expansion@>=2 <3': 2.1.7
  dompurify: 3.4.17
  ip-address: 10.7.6
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  nanoid: 3.3.20
  sass-embedded: 1.107.1
  undici: 7.30.1

allowBuilds:
  '@carbon/icons': true
  '@carbon/pictograms': true
  '@parcel/watcher': true
  '@vaadin/vaadin-usage-statistics': true
  core-js: true
  es5-ext: true
  esbuild: true
  ttf2woff2: false

minimumReleaseAge: 0
trustLockfile: true
